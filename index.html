<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Love</title>
<style>
body {
margin: 0;
padding: 0;
overflow: hidden;
background: linear-gradient(135deg, #ff9a9e, #fecfef, #fad0c4);
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
font-family: Arial, sans-serif;
}

canvas {
position: fixed;
top: 0;
left: 0;
z-index: 1;
}

.frame {
position: relative;
z-index: 2;
width: 300px;
height: 300px;
border-radius: 50%;
border: 8px solid white;
box-shadow: 0 0 30px rgba(255,255,255,0.8);
overflow: hidden;
animation: pulse 2s infinite;
}

.frame img {
width: 100%;
height: 100%;
object-fit: cover;
}

@keyframes pulse {
0% { transform: scale(1); }
50% { transform: scale(1.05); }
100% { transform: scale(1); }
}

.title {
position: fixed;
top: 40px;
width: 100%;
text-align: center;
color: white;
font-size: 40px;
z-index: 2;
text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
}

.center {
position: relative;
z-index: 2;
display: flex;
flex-direction: column;
align-items: center;
}

.question {
position: fixed;
bottom: 60px;
width: 100%;
text-align: center;
z-index: 3;
}

.question p {
color: white;
font-size: 26px;
text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
margin-bottom: 20px;
}

.yesBtn {
padding: 15px 30px;
font-size: 20px;
background: green;
color: white;
border: none;
border-radius: 10px;
cursor: pointer;
margin: 0 10px;
}

.noBtn {
padding: 15px 30px;
font-size: 20px;
background: red;
color: white;
border: none;
border-radius: 10px;
cursor: pointer;
margin: 0 10px;
position: relative;
}

.answer {
color: white;
font-size: 30px;
text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
margin-top: 20px;
}
</style>
</head>
<body>

<div class="title">I Love You</div>

<canvas id="hearts"></canvas>

<div class="center">
<div class="frame">
<img src="girl.jpg" alt="my girl">
</div>
</div>

<div class="question">
<p>APni chitti bund doge??</p>
<button class="yesBtn" onclick="sayYes()">HA puri rat lena meri</button>
<button class="noBtn" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">nahi virgin rehna mene</button>
<div class="answer" id="answer"></div>
</div>
<script>
var canvas = document.getElementById("hearts");
var ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.onresize = function() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
};

var hearts = [];

function makeHeart() {
var heart = {};
heart.x = Math.random() * canvas.width;
heart.y = canvas.height + 20;
heart.size = 10 + Math.random() * 20;
heart.speed = 1 + Math.random() * 2;
heart.drift = Math.random() * 2 - 1;
heart.opacity = 0.5 + Math.random() * 0.5;
return heart;
}

for (var i = 0; i < 40; i++) {
hearts.push(makeHeart());
}

function drawHeart(x, y, size, opacity) {
ctx.save();
ctx.globalAlpha = opacity;
ctx.fillStyle = "red";
ctx.beginPath();
var topCurveHeight = size * 0.3;
ctx.moveTo(x, y + topCurveHeight);
ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
ctx.closePath();
ctx.fill();
ctx.restore();
}

function animate() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
for (var i = 0; i < hearts.length; i++) {
var heart = hearts[i];
heart.y = heart.y - heart.speed;
heart.x = heart.x + heart.drift;
drawHeart(heart.x, heart.y, heart.size, heart.opacity);
if (heart.y < -30) {
hearts[i] = makeHeart();
}
}
requestAnimationFrame(animate);
}

animate();

function moveNo() {
var btn = document.getElementById("noBtn");
var x = Math.random() * (window.innerWidth - 150);
var y = Math.random() * (window.innerHeight - 150);
btn.style.position = "fixed";
btn.style.left = x + "px";
btn.style.top = y + "px";
}

function sayYes() {
document.getElementById("answer").innerHTML = "hehehheheheh chal be ulti ho randi";
}
</script>

</body>
</html>
